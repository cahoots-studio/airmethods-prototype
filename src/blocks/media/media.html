<!-- BLOCK: media
     Mirrored from Figma · Media [Ratio × Image]

     The Image swap property has no markup equivalent — in code you set the src.
     Figma's twelve-variant library exists so a mockup can show variety; the
     grade that made those variants distinct lives in --sc-image-treatment. -->

<figure class="media is-16x9">
  <img src="" alt="" loading="lazy" decoding="async">
</figure>

<!-- Empty state: no img child. The Foreground fill shows through, which reads
     as reserved space rather than a broken image. -->
<figure class="media is-4x3"></figure>
